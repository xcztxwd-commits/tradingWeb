server:
  port: 8080

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:}
  engagement:
    assets:
      storage: ${ENGAGEMENT_ASSET_STORAGE:disabled}
      local-root: ${ENGAGEMENT_ASSET_LOCAL_ROOT:./var/engagement-assets}
      max-bytes: ${ENGAGEMENT_ASSET_MAX_BYTES:5242880}
    scheduler:
      enabled: ${ENGAGEMENT_SCHEDULER_ENABLED:false}
    retention:
      enabled: ${ENGAGEMENT_RETENTION_ENABLED:false}
      fixed-delay: ${ENGAGEMENT_RETENTION_FIXED_DELAY:PT24H}
    outbox:
      enabled: false

admin:
  bootstrap:
    enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}

spring:
  application:
    name: fx-platform-backend

  servlet:
    multipart:
      max-file-size: ${ENGAGEMENT_ASSET_HTTP_MAX_FILE_SIZE:5MB}
      max-request-size: ${ENGAGEMENT_ASSET_HTTP_MAX_REQUEST_SIZE:6MB}

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fx_platform}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

security:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expire-minutes: ${JWT_ACCESS_EXPIRE_MINUTES:30}
    refresh-token-expire-days: ${JWT_REFRESH_EXPIRE_DAYS:7}
  config:
    encryption-key: ${CONFIG_ENCRYPTION_KEY}

massive:
  api-key: ${MASSIVE_API_KEY:}
  rest-base-url: ${MASSIVE_REST_BASE_URL:https://api.massive.com}
  websocket-forex-url: ${MASSIVE_WS_FOREX_URL:wss://socket.massive.com/forex}
  quote-stale-ms: ${MARKET_QUOTE_STALE_MS:3000}
  write-quotes-to-db: ${MARKET_WRITE_QUOTES_TO_DB:false}
  flat-files:
    access-key-id: ${MASSIVE_S3_ACCESS_KEY_ID:}
    secret-access-key: ${MASSIVE_S3_SECRET_ACCESS_KEY:}
    endpoint: ${MASSIVE_S3_ENDPOINT:https://files.massive.com}
    bucket: ${MASSIVE_S3_BUCKET:flatfiles}

binance:
  rest-base-url: ${BINANCE_REST_BASE_URL:https://api.binance.com}
  web-base-url: ${BINANCE_WEB_BASE_URL:https://www.binance.com}
  futures-base-url: ${BINANCE_FUTURES_BASE_URL:https://fapi.binance.com}
  websocket-base-url: ${BINANCE_WS_BASE_URL:wss://stream.binance.com:9443/ws}

okx:
  rest-base-url: ${OKX_REST_BASE_URL:https://www.okx.com}

market:
  fear-greed-url: ${MARKET_FEAR_GREED_URL:https://api.alternative.me/fng/?limit=1&format=json}
  quote-stale-ms: ${MARKET_QUOTE_STALE_MS:3000}
  bundle-freshness: ${MARKET_BUNDLE_FRESHNESS:3s}
  public-http-timeout: ${MARKET_PUBLIC_HTTP_TIMEOUT:2s}
  local-perp:
    simulated-premium: ${MARKET_LOCAL_PERP_SIMULATED_PREMIUM:0.0001}
    premium-limit: ${MARKET_LOCAL_PERP_PREMIUM_LIMIT:0.001}
  demo-quotes:
    enabled: ${MARKET_DEMO_QUOTES_ENABLED:false}
  realtime:
    enabled: ${MARKET_REALTIME_ENABLED:false}
    provider: ${MARKET_REALTIME_PROVIDER:binance}
    websocket-base-url: ${BINANCE_WS_BASE_URL:wss://stream.binance.com:9443/ws}
    symbols: ${MARKET_REALTIME_SYMBOLS:BTCUSDT,ETHUSDT}
    quote-stale: ${MARKET_REALTIME_QUOTE_STALE:3s}
    reconnect-initial: ${MARKET_REALTIME_RECONNECT_INITIAL:1s}
    reconnect-max: ${MARKET_REALTIME_RECONNECT_MAX:30s}
    reconnect-jitter: ${MARKET_REALTIME_RECONNECT_JITTER:250ms}
    unsubscribe-grace: ${MARKET_REALTIME_UNSUBSCRIBE_GRACE:10s}
    binance-command-per-second: ${MARKET_BINANCE_COMMAND_PER_SECOND:4}
    backfill-enabled: ${MARKET_REALTIME_BACKFILL_ENABLED:true}
    backfill-lookback: ${MARKET_REALTIME_BACKFILL_LOOKBACK:60m}
    kline-intervals: ${MARKET_REALTIME_KLINE_INTERVALS:1s,1m,5m,15m,1h,4h,1d}
    order-book-levels: ${MARKET_REALTIME_ORDER_BOOK_LEVELS:20}
    order-book-fast: ${MARKET_REALTIME_ORDER_BOOK_FAST:true}
    max-streams-per-connection: ${MARKET_REALTIME_MAX_STREAMS_PER_CONNECTION:1024}
    max-active-symbols: ${MARKET_REALTIME_MAX_ACTIVE_SYMBOLS:80}
    dynamic-symbols-enabled: ${MARKET_REALTIME_DYNAMIC_SYMBOLS_ENABLED:true}
  provider-instrument-sync:
    enabled: ${MARKET_PROVIDER_INSTRUMENT_SYNC_ENABLED:false}
    initial-delay-ms: ${MARKET_PROVIDER_INSTRUMENT_SYNC_INITIAL_DELAY_MS:60000}
    fixed-delay-ms: ${MARKET_PROVIDER_INSTRUMENT_SYNC_FIXED_DELAY_MS:21600000}
  provider-symbol-cache-ttl-ms: ${MARKET_PROVIDER_SYMBOL_CACHE_TTL_MS:300000}
  provider-snapshot-cache-ttl-ms: ${MARKET_PROVIDER_SNAPSHOT_CACHE_TTL_MS:15000}
  quote-broadcast-enabled: ${MARKET_QUOTE_BROADCAST_ENABLED:false}
  quote-broadcast-ms: ${MARKET_QUOTE_BROADCAST_MS:1000}
  quote-broadcast-symbols: ${MARKET_QUOTE_BROADCAST_SYMBOLS:}
  test-data:
    enabled: ${MARKET_TEST_DATA_ENABLED:false}
    realtime-ms: ${MARKET_TEST_DATA_REALTIME_MS:1000}
    symbols: ${MARKET_TEST_DATA_SYMBOLS:}
  test-control:
    enabled: ${MARKET_TEST_CONTROL_ENABLED:false}
    max-ttl: ${MARKET_TEST_CONTROL_MAX_TTL:5m}

execution:
  mode: ${EXECUTION_MODE:disabled}
  demo:
    matching-mode: ${DEMO_MATCHING_MODE:SIMPLE}
    maker-fee-rate: ${DEMO_MAKER_FEE_RATE:0.0002}
    taker-fee-rate: ${DEMO_TAKER_FEE_RATE:0.0005}
    liquidation-fee-rate: ${DEMO_LIQUIDATION_FEE_RATE:0.001}
    slippage-rate: ${DEMO_SLIPPAGE_RATE:0.0001}
  broker:
    endpoint: ${EXECUTION_BROKER_ENDPOINT:}
    api-key: ${EXECUTION_BROKER_API_KEY:}
    account-id: ${EXECUTION_BROKER_ACCOUNT_ID:}
  fix:
    endpoint: ${EXECUTION_FIX_ENDPOINT:}
    api-key: ${EXECUTION_FIX_API_KEY:}
    account-id: ${EXECUTION_FIX_ACCOUNT_ID:}
  lp:
    endpoint: ${EXECUTION_LP_ENDPOINT:}
    api-key: ${EXECUTION_LP_API_KEY:}
    account-id: ${EXECUTION_LP_ACCOUNT_ID:}

trading:
  default-demo-balance: ${DEFAULT_DEMO_BALANCE:50000}
  default-account-currency: ${DEFAULT_ACCOUNT_CURRENCY:USDT}
  default-leverage: ${DEFAULT_LEVERAGE:10}
  margin-call-level: ${MARGIN_CALL_LEVEL:100}
  stop-out-level: ${STOP_OUT_LEVEL:50}
  pending-order-execution-enabled: ${TRADING_PENDING_ORDER_EXECUTION_ENABLED:false}
  protective-order-execution-enabled: ${TRADING_PROTECTIVE_ORDER_EXECUTION_ENABLED:false}
  funding:
    enabled: ${TRADING_FUNDING_ENABLED:false}
    scan-ms: ${TRADING_FUNDING_SCAN_MS:60000}
  fx-financing:
    enabled: ${TRADING_FX_FINANCING_ENABLED:false}
    scan-ms: ${TRADING_FX_FINANCING_SCAN_MS:86400000}
  liquidation:
    enabled: ${TRADING_LIQUIDATION_ENABLED:false}
    scan-interval-ms: ${TRADING_LIQUIDATION_SCAN_INTERVAL_MS:60000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
  global-config:
    db-config:
      id-type: input

trading-lab:
  queue:
    enabled: ${TRADING_LAB_QUEUE_ENABLED:false}
  report:
    chunk-bytes: ${TRADING_LAB_REPORT_CHUNK_BYTES:262144}
    max-logical-value-bytes: ${TRADING_LAB_REPORT_MAX_LOGICAL_VALUE_BYTES:1048576}
    max-active-writers: ${TRADING_LAB_REPORT_MAX_ACTIVE_WRITERS:1}
    retention: ${TRADING_LAB_REPORT_RETENTION:P30D}
    cleanup:
      enabled: ${TRADING_LAB_REPORT_CLEANUP_ENABLED:false}
      fixed-delay: ${TRADING_LAB_REPORT_CLEANUP_FIXED_DELAY:PT1H}
