app:
  engagement:
    assets:
      storage: ${ENGAGEMENT_ASSET_STORAGE:disabled}
      max-bytes: ${ENGAGEMENT_ASSET_MAX_BYTES:5242880}
    scheduler:
      enabled: ${ENGAGEMENT_SCHEDULER_ENABLED:true}
    retention:
      enabled: ${ENGAGEMENT_RETENTION_ENABLED:true}
    outbox:
      enabled: ${ENGAGEMENT_OUTBOX_ENABLED:true}

market:
  demo-quotes:
    enabled: ${MARKET_DEMO_QUOTES_ENABLED:false}
  test-data:
    enabled: ${MARKET_TEST_DATA_ENABLED:false}

execution:
  mode: ${EXECUTION_MODE:disabled}

logging:
  level:
    com.fxplatform: INFO
