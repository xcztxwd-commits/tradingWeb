services:
  postgres:
    image: postgres:16
    container_name: fx-platform-postgres
    environment:
      POSTGRES_DB: fx_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - fx_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: fx-platform-redis
    ports:
      - "6379:6379"

volumes:
  fx_postgres_data:
